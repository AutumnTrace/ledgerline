name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  unit:
    name: Build and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore -c Release

      - name: Unit tests
        run: >
          dotnet test --no-build -c Release
          --filter "Category!=Integration"
          --logger "trx;LogFileName=unit.trx"
          --collect "XPlat Code Coverage"
          --results-directory TestResults/unit

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: unit-test-results
          path: TestResults/unit/**

  integration:
    name: Integration tests (Testcontainers)
    runs-on: ubuntu-latest
    needs: unit
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Pre-pull container images
        run: docker pull -q postgres:18-alpine && docker pull -q apache/kafka:4.4.0

      - name: Integration tests (PostgreSQL 18, Kafka 4)
        run: >
          dotnet test tests/Ledgerline.IntegrationTests -c Release
          --logger "trx;LogFileName=integration.trx"
          --logger "console;verbosity=normal"
          --collect "XPlat Code Coverage"
          --results-directory TestResults/integration

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: integration-test-results
          path: TestResults/integration/**

  coverage:
    name: Coverage report
    runs-on: ubuntu-latest
    needs: [unit, integration]
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: "*-test-results"
          path: results

      - name: Merge unit and integration coverage
        uses: danielpalme/ReportGenerator-GitHub-Action@5
        with:
          reports: results/**/coverage.cobertura.xml
          targetdir: coverage
          reporttypes: MarkdownSummaryGithub;Cobertura
          classfilters: "-Ledgerline.Infrastructure.Persistence.Migrations.*"

      - name: Publish summary
        run: cat coverage/SummaryGithub.md >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: coverage/**

  query-plans:
    name: Query plans (PostgreSQL, EXPLAIN ANALYZE)
    runs-on: ubuntu-latest
    needs: unit
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: ledgerline
          POSTGRES_PASSWORD: ledgerline
          POSTGRES_DB: ledgerline
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ledgerline"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Seed 2M postings and explain the hot queries
        run: >
          dotnet run -c Release --project benchmarks/Ledgerline.QueryPlans --
          "Host=localhost;Username=ledgerline;Password=ledgerline;Database=ledgerline;Command Timeout=600"
          query-plans.md

      - name: Publish the report to the job summary
        run: cat query-plans.md >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v7
        with:
          name: query-plans
          path: query-plans.md

  docker:
    name: Docker image and end-to-end smoke test
    runs-on: ubuntu-latest
    needs: unit
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: |
            ledgerline:ci
            ledgerline:local
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Image runs as a non-root user
        run: |
          user=$(docker inspect --format '{{.Config.User}}' ledgerline:ci)
          echo "Container user: $user"
          test -n "$user" && test "$user" != "root" && test "$user" != "0"

      - name: Smoke test the image alone (SQLite, in-memory transport)
        run: |
          docker run -d --name ledgerline-solo -p 8081:8080 ledgerline:ci
          scripts/smoke-test.sh http://localhost:8081 || { docker logs ledgerline-solo; exit 1; }
          docker rm -f ledgerline-solo

      - name: Validate the compose file
        run: docker compose config --quiet

      - name: Smoke test the full stack (PostgreSQL, Kafka)
        run: |
          docker compose up -d --wait postgres kafka
          docker compose up -d --no-build api
          scripts/smoke-test.sh http://localhost:8080 || { docker compose logs api; exit 1; }

      - name: The outbox delivered to Kafka
        run: |
          docker compose exec -T kafka /opt/kafka/bin/kafka-console-consumer.sh \
            --bootstrap-server localhost:9092 --topic ledger.entries.v1 --from-beginning \
            --max-messages 3 --timeout-ms 30000 --property print.key=true --property print.headers=true \
            | tee kafka-messages.txt
          test "$(grep -c 'ledger.entry.posted.v1' kafka-messages.txt)" -ge 3

      - name: API logs
        if: always()
        run: docker compose logs api | tail -n 100

      - name: Tear down
        if: always()
        run: docker compose down -v
