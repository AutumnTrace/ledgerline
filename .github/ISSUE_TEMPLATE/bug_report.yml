name: Bug report
description: Something in the ledger behaves incorrectly
labels: [bug]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: The request you sent (method, path, body) and what you saw.
      placeholder: |
        POST /v1/wallet/bets
        { "transactionId": "...", ... }
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true
  - type: textarea
    id: response
    attributes:
      label: Response
      description: Status code and body. Problem details include a `traceId` that helps find the logs.
      render: json
  - type: dropdown
    id: database
    attributes:
      label: Database provider
      options: [SQLite, PostgreSQL]
  - type: dropdown
    id: transport
    attributes:
      label: Message transport
      options: [InMemory, Kafka]
  - type: input
    id: version
    attributes:
      label: Version / commit
      placeholder: v0.1.0
  - type: checkboxes
    id: money
    attributes:
      label: Money impact
      options:
        - label: The ledger does not balance (trial balance shows a non-zero net) or a balance looks wrong
