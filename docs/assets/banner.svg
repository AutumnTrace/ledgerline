<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320" role="img" aria-labelledby="title desc">
  <title id="title">Ledgerline</title>
  <desc id="desc">Double-entry wallet ledger: credits and debits mirrored around a zero line.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0f1e"/>
      <stop offset="0.55" stop-color="#101a34"/>
      <stop offset="1" stop-color="#0b2a2c"/>
    </linearGradient>
    <linearGradient id="credit" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#2dd4bf" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#5eead4"/>
    </linearGradient>
    <linearGradient id="debit" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f59e0b" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#fbbf24"/>
    </linearGradient>
    <linearGradient id="title-fill" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#99f6e4"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.78" cy="0.5" r="0.45">
      <stop offset="0" stop-color="#14b8a6" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#14b8a6" stop-opacity="0"/>
    </radialGradient>
    <pattern id="ruled" width="40" height="32" patternUnits="userSpaceOnUse">
      <path d="M0 31.5 H40" stroke="#94a3b8" stroke-opacity="0.07"/>
    </pattern>
  </defs>

  <rect width="1280" height="320" rx="24" fill="url(#bg)"/>
  <rect width="1280" height="320" rx="24" fill="url(#ruled)"/>
  <rect width="1280" height="320" rx="24" fill="url(#glow)"/>
  <path d="M96 40 V280" stroke="#f43f5e" stroke-opacity="0.25"/>

  <g font-family="Segoe UI, Helvetica, Arial, sans-serif">
    <text x="128" y="148" font-size="76" font-weight="700" letter-spacing="-1" fill="url(#title-fill)">ledgerline</text>
    <text x="131" y="196" font-size="24" fill="#cbd5e1">Double-entry wallet ledger for player balances</text>
    <text x="131" y="236" font-size="17" fill="#64748b" letter-spacing="0.5">DDD · CQRS · optimistic concurrency · idempotent postings · outbox to Kafka</text>
  </g>

  <!-- Credits above the zero line mirror debits below it: every entry sums to zero. -->
  <g transform="translate(800 160)">
    <path d="M0 0 H400" stroke="#e2e8f0" stroke-opacity="0.55" stroke-width="1.5"/>
    <rect x="16" y="-62" width="34" height="62" rx="4" fill="url(#credit)"/>
    <rect x="16" y="0" width="34" height="62" rx="4" fill="url(#debit)"/>
    <rect x="82" y="-104" width="34" height="104" rx="4" fill="url(#credit)"/>
    <rect x="82" y="0" width="34" height="104" rx="4" fill="url(#debit)"/>
    <rect x="148" y="-38" width="34" height="38" rx="4" fill="url(#credit)"/>
    <rect x="148" y="0" width="34" height="38" rx="4" fill="url(#debit)"/>
    <rect x="214" y="-82" width="34" height="82" rx="4" fill="url(#credit)"/>
    <rect x="214" y="0" width="34" height="82" rx="4" fill="url(#debit)"/>
    <rect x="280" y="-120" width="34" height="120" rx="4" fill="url(#credit)"/>
    <rect x="280" y="0" width="34" height="120" rx="4" fill="url(#debit)"/>
    <rect x="346" y="-54" width="34" height="54" rx="4" fill="url(#credit)"/>
    <rect x="346" y="0" width="34" height="54" rx="4" fill="url(#debit)"/>
    <polyline points="33,-78 99,-120 165,-54 231,-98 297,-136 363,-70" fill="none" stroke="#5eead4" stroke-width="2" stroke-linejoin="round" stroke-opacity="0.8"/>
    <g fill="#5eead4">
      <circle cx="33" cy="-78" r="3.5"/>
      <circle cx="99" cy="-120" r="3.5"/>
      <circle cx="165" cy="-54" r="3.5"/>
      <circle cx="231" cy="-98" r="3.5"/>
      <circle cx="297" cy="-136" r="3.5"/>
      <circle cx="363" cy="-70" r="3.5"/>
    </g>
    <text x="404" y="5" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#94a3b8">Σ = 0</text>
  </g>
</svg>
